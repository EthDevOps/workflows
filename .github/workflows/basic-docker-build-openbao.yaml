name: Docker Image build (OpenBao)

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_call:
    inputs:
      bao_role:
        description: "OpenBao jwt-github role name (see github_actions_roles in internal-stack-iac)"
        type: string
        required: true
      bao_secret_path:
        description: "KV2 path holding the registry credentials, with keys 'user' and 'pass'"
        type: string
        required: true
      bao_address:
        type: string
        default: https://tyrell.ethquokkaops.io
      docker_registry:
        default: docker.ethquokkaops.io
        type: string
      docker_registry_project:
        default: ethquokkaops
        type: string
      use_artifact:
        type: boolean
        default: false
      artifact_path:
        type: string
      artifact_name:
        type: string
      build_args:
        type: string
        description: "JSON string of build arguments to pass to docker build"
        required: false
      build_args_secret_name:
        type: string
        description: "Name of a build arg whose value comes from the BUILD_ARG_SECRET secret. The caller must forward the value via the call's secrets: mapping (the secrets context is not available in the caller's with: inputs)."
        default: ''
      dockerfile:
        type: string
        default: Dockerfile
      tag_suffix:
        type: string
        default: ''
      tags:
        description: "docker/metadata-action tags (YAML list, newline-separated). Empty = the action's default tag types."
        type: string
        default: ''
      platforms:
        description: "docker buildx platforms (e.g. linux/amd64,linux/arm64). Empty = runner architecture only."
        type: string
        default: ''
    secrets:
      BUILD_ARG_SECRET:
        required: false
        description: "Value for the build arg named by build_args_secret_name. Callers forward their own secret here."

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for the GitHub OIDC token used to authenticate against OpenBao.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
        if: ${{ inputs.use_artifact }}

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Fetch registry credentials from OpenBao
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          url: ${{ inputs.bao_address }}
          path: jwt-github
          method: jwt
          role: ${{ inputs.bao_role }}
          exportEnv: true
          secrets: |
            ${{ inputs.bao_secret_path }} user | DOCKER_REGISTRY_USER ;
            ${{ inputs.bao_secret_path }} pass | DOCKER_REGISTRY_SECRET

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ inputs.docker_registry }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ inputs.docker_registry }}
          username: ${{ env.DOCKER_REGISTRY_USER }}
          password: ${{ env.DOCKER_REGISTRY_SECRET }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7
        with:
          images: ${{ inputs.docker_registry }}/${{ inputs.docker_registry_project }}/${{ github.repository }}
          tags: ${{ inputs.tags }}
          flavor: |
            suffix=${{ inputs.tag_suffix }}

      # Compose the final build-args JSON. The literal build_args input is
      # merged with one secret-sourced arg (build_args_secret_name), whose value
      # the caller forwards via this workflow's BUILD_ARG_SECRET secret. GitHub
      # does not allow the secrets context in the caller's with: inputs, so the
      # value arrives this way.
      - name: Compose build args
        id: build-args
        env:
          BASE_ARGS: ${{ inputs.build_args }}
          SECRET_ARG_NAME: ${{ inputs.build_args_secret_name }}
          SECRET_ARG_VALUE: ${{ secrets.BUILD_ARG_SECRET }}
        run: |
          args="${BASE_ARGS}"
          if [ -z "$args" ] || [ "$args" = "null" ]; then
            args='{}'
          fi
          if [ -n "$SECRET_ARG_NAME" ]; then
            args="$(printf '%s' "$args" | jq -c --arg n "$SECRET_ARG_NAME" --arg v "$SECRET_ARG_VALUE" '. + {($n): $v}')"
          fi
          # Keep the historical empty value for callers that pass no build args.
          if [ "$args" = "{}" ]; then
            args=''
          fi
          {
            echo "json<<EOF_BUILD_ARGS"
            printf '%s' "$args"
            echo "EOF_BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16
        with:
          file: ${{ inputs.dockerfile }}
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.json }}
